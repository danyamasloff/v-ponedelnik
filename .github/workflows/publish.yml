name: publish

on:
  # Deploying scheduler changes checks the cloud connections without posting.
  push:
    branches: [master]
    paths:
      - .github/workflows/publish.yml
      - src/channel_factory/publishers/scheduler.py
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      preflight_only:
        description: "Только проверить доступ к MAX и базе, ничего не публиковать"
        type: boolean
        default: false
        required: false

concurrency:
  # Два прогона одновременно не нужны: слот всё равно один.
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
      MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CONTENT_API_BASE_URL: ${{ secrets.CONTENT_API_BASE_URL }}
      CONTENT_API_KEY: ${{ secrets.CONTENT_API_KEY }}
      CONTENT_MODEL: ${{ secrets.CONTENT_MODEL }}
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'DRY_RUN' }}
      AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'false' }}
      TZ: Europe/Moscow
      PUBLISH_SLOTS: "09:00,14:00,19:00"
      PUBLISH_SLOT_WINDOW_MINUTES: "180"
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Проверка связи до всего остального: сюда же смотрим, доступен ли MAX
      # Bot API с зарубежного runner'а. Если нет — конвейеру здесь не место,
      # и это выяснится на первом же запуске, а не в день публикации.
      # Порядок важен: сначала выясняем, доходит ли запрос до MAX с
      # зарубежного runner'а, и только потом проверяем права в канале.
      # Иначе незаданный MAX_CHAT_ID замаскирует главный вопрос переезда.
      - name: Показать время и расписание
        run: |
          date '+%Y-%m-%d %H:%M:%S %Z'
          echo "Слоты: $PUBLISH_SLOTS МСК. Проверка каждые 20 минут; возможны задержки GitHub."

      - name: Проверить базу
        run: uv run python -m channel_factory.cli db-status

      - name: Проверить связь с MAX
        run: uv run python -m channel_factory.cli max-whoami

      - name: Проверить права в канале
        run: uv run python -m channel_factory.cli max-check

      - name: Применить миграции
        if: ${{ !inputs.preflight_only && github.event_name != 'push' }}
        run: uv run python -m alembic upgrade head

      - name: Опубликовать, если пора
        if: ${{ !inputs.preflight_only && github.event_name != 'push' }}
        run: uv run python -m channel_factory.cli publish-due
