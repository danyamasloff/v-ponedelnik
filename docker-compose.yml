services:
  postgres:
    image: postgres:17-alpine
    container_name: yan-channel-factory-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-channel_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-channel_factory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-channel_factory} -d ${POSTGRES_DB:-channel_factory}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
    name: yan-channel-factory-pgdata
