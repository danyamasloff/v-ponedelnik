# Бренд канала. Один файл, из которого берутся подпись на карточках и правила
# тона в промптах — чтобы канал звучал одинаково независимо от того, писал ли
# пост человек или модель.
#
# Менять здесь — значит менять канал целиком: это и есть смысл файла.
version: 1

name: В понедельник
tagline: практические навыки работы с ИИ
# Обещание читателю одной фразой. Проверка для любого поста: если он этому не
# отвечает, пост не наш, каким бы интересным ни был.
promise: то, что можно применить на этой рабочей неделе

voice:
  - пиши так, будто объясняешь коллеге за обедом — спокойно и конкретно
  - никаких восклицаний, эмодзи и слов «революция», «прорыв», «изменит всё»
  - если фактов мало, скажи об этом прямо, а не заполняй пустоту словами
  - лучше один проверяемый шаг, чем пять общих советов

# Чего в канале не бывает — это тоже часть голоса.
never:
  - пересказ чужой статьи вместо собственного разбора
  - обещания заработка и «успешного успеха»
  - советы, которые нельзя проверить на своей задаче

card:
  # Подпись внизу карточки. Короткая: на превью в ленте её читают мельком.
  footer: В понедельник · практические навыки
  default_kicker: разбор
