# Column mapping for market-data exports (Yandex Direct / channel catalogs).
#
# Aliases are matched after normalization: lowercase, "ё" -> "е", punctuation
# stripped, whitespace collapsed. "%" is NOT stripped, because it carries the
# column's unit ("ERR, %" must stay distinguishable from a bare "ERR").
#
# An alias can be either a plain string, or a mapping that declares the unit the
# column is written in:
#
#   - header: "Просмотры, тыс"     source header
#     scale: 1000                  multiply values by this
#     percent_points: true         values are percent points, not fractions
#     currency: RUB                currency of a monetary column
#
# Units belong to the column, not to individual values, which is why they are
# declared here instead of being guessed per row.
#
# Verified against the real export data/raw/direct/yandex_direct_all_2026-09-02.xlsx
# (11 109 channels, header on row 7, summary block above it).
version: 1

# Import fails with a clear error if any of these cannot be found in the file.
required:
  - channel_name

fields:
  channel_name:
    - "Канал"
    - "Название канала"      # real Yandex Direct export
    - "Имя канала"
    - "Площадка"
    - "Channel"
    - "Channel name"
    - "Title"

  channel_url:
    - "Ссылка"
    - "Ссылка на канал"      # real Yandex Direct export
    - "Адрес"
    - "URL"
    - "Link"
    - "Channel URL"

  channel_external_id:
    - "ID канала"
    - "Идентификатор"
    - "Идентификатор канала"
    - "Channel ID"
    - "External ID"

  platform:
    - "Платформа"
    - "Мессенджер"           # real Yandex Direct export ("Telegram" / "МАКС")
    - "Platform"
    - "Messenger"

  category:
    - "Категория"
    - "Категория канала"     # real Yandex Direct export
    - "Тематика"
    - "Рубрика"
    - "Ниша"
    - "Category"
    - "Topic"
    - "Niche"

  subscribers:
    - "Подписчики"
    - "Количество подписчиков"  # real Yandex Direct export (values like "2К")
    - "Подписчиков"
    - "Аудитория"
    - "Subscribers"
    - "Audience"

  err:
    - "ERR"
    - header: "ERR, %"       # real Yandex Direct export: integers like "7" = 7%
      percent_points: true
    - header: "ERR %"
      percent_points: true
    - "Вовлеченность"
    - "Вовлечённость"
    - "Engagement rate"

  predicted_views:
    - "Прогноз просмотров"
    - "Просмотры"
    - header: "Просмотры, тыс"  # real Yandex Direct export: "0.1" = 100 views
      scale: 1000
      note: "источник публикует просмотры в тысячах"
    - "Охват"
    - "Predicted views"
    - "Views"
    - "Reach"

  cpv:
    - "CPV"
    - header: "CPV, RUB"     # real Yandex Direct export
      currency: RUB
    - "Цена за просмотр"
    - "Стоимость просмотра"
    - "Cost per view"

  campaign_price:
    - "Стоимость размещения"
    - header: "Прогноз цены, RUB"  # real Yandex Direct export
      currency: RUB
    - "Стоимость"
    - "Цена"
    - "Бюджет"
    - "Price"
    - "Campaign price"

  currency:
    - "Валюта"
    - "Currency"

  region:
    - "Регион"
    - "Гео"
    - "Region"
    - "Geo"

  snapshot_date:
    - "Дата"
    - "Дата выгрузки"
    - "Период"
    - "Date"
    - "Snapshot date"
