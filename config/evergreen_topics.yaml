# Собственные темы канала: посты, которые мы пишем сами, а не вслед за чужой
# новостью. Это то, ради чего читатель подписывается — новости он и так увидит.
#
# Правила ведения этого файла:
#   * тема формулируется как обещание пользы, а не как заголовок статьи;
#   * angle — под каким углом мы её берём, чтобы два поста об одном не были
#     одинаковыми;
#   * takeaway — что читатель должен унести. Если сформулировать не получается,
#     тема сырая и её не время публиковать;
#   * ничего про «нейросети изменят мир»: канал про то, что делать в понедельник.
#
# Ссылок здесь нет намеренно: пост должен быть самодостаточным внутри MAX.
version: 1

topics:
  - key: prompt-context-first
    title: Почему модель «не понимает» задачу и что с этим делать
    angle: Разбор одной ошибки — просят результат, не дав контекста
    takeaway: Шаблон запроса из четырёх частей — роль, вход, ограничения, формат
    audience: Те, кто уже пробовал и разочаровался

  - key: ai-meeting-notes
    title: Как за десять минут разобрать часовую встречу
    angle: Пошаговый разбор рутины, знакомой каждому
    takeaway: Готовая последовательность — расшифровка, выжимка, задачи с владельцами

  - key: check-model-answer
    title: Как проверять ответ модели, если вы не эксперт в теме
    angle: Практика проверки, а не рассуждение о галлюцинациях
    takeaway: Три приёма перепроверки, которые ловят большую часть выдумок

  - key: excel-to-insight
    title: "Таблица на тысячу строк: что спросить у модели, чтобы получить пользу"
    angle: Конкретные формулировки вопросов к данным
    takeaway: Пять запросов, которые превращают выгрузку в выводы

  - key: email-tone
    title: Письмо, которое не выглядит написанным нейросетью
    angle: Что именно выдаёт машинный текст и как это убрать
    takeaway: Чек-лист правки из шести пунктов

  - key: ai-for-study
    title: Как готовиться к экзамену с моделью и не выучить чужие ошибки
    angle: Учебный сценарий, где цена ошибки высокая
    takeaway: Схема «объясни — проверь — объясни своими словами»

  - key: local-vs-cloud
    title: Когда локальная модель лучше облачной, а когда это лишние хлопоты
    angle: Честное сравнение по задачам, а не по бенчмаркам
    takeaway: Правило выбора по трём вопросам о данных, скорости и бюджете

  - key: what-not-to-send
    title: Что нельзя отправлять в чат-бот на работе
    angle: Риски простым языком, без запугивания
    takeaway: Список категорий данных и что делать вместо

  - key: automate-one-task
    title: "Первая автоматизация: как выбрать задачу, с которой стоит начать"
    angle: Критерии выбора, а не обзор инструментов
    takeaway: Три признака задачи, которая окупит время на настройку

  - key: ai-search-vs-google
    title: Когда спрашивать модель, а когда всё-таки искать самому
    angle: Разграничение сценариев по типу вопроса
    takeaway: Простой критерий — проверяемость и свежесть ответа

  - key: rewrite-your-prompt
    title: Один и тот же запрос, три формулировки, разный результат
    angle: Наглядное сравнение на одном примере
    takeaway: Что именно в формулировке меняет качество ответа

  - key: ai-job-skills
    title: Какие навыки работы с ИИ реально спрашивают в вакансиях
    angle: Опора на то, что пишут работодатели, а не на прогнозы
    takeaway: Короткий список навыков, которые стоит отработать первыми
